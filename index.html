<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment</title>
</head>

<body style="margin:0; padding:0; background:#f3f4f6;">

    <div class="booking-container" style="width:100%; margin:0; padding:0;">
        <iframe
            id="booking-frame"
            src="https://book.booklogica.com/northbound"
            title="Book an appointment"
            scrolling="no"
            style="display:block; width:100%; height:500px; border:0; margin:0; padding:0; background:transparent;">
        </iframe>
    </div>

    <script>
        const BOOKING_ORIGIN = "https://book.booklogica.com";

        const bookingFrame = document.getElementById("booking-frame");

        // Client theme
        const theme = {
            background: "transparent",
            card: "#EAF4FF",
            surface: "#CFE4FA",
            message: "#EAF4FF"
        };

        function sendTheme() {
            if (!bookingFrame.contentWindow) return;

            bookingFrame.contentWindow.postMessage(
                {
                    type: "booking:theme",
                    theme: theme
                },
                BOOKING_ORIGIN
            );
        }

        // Preserve the original iframe resize behavior.
        window.addEventListener("message", event => {
            if (event.origin !== BOOKING_ORIGIN) return;
            if (event.source !== bookingFrame.contentWindow) return;

            if (event.data?.type === "booking:resize") {
                const height = Number(event.data.height);

                if (Number.isFinite(height) && height > 0) {
                    bookingFrame.style.height = `${height}px`;
                }
            }
        });

        // Send colors after the booking page loads.
        bookingFrame.addEventListener("load", sendTheme);
    </script>

</body>
</html>
