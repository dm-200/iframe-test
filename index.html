<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment</title>
</head>

<body style="margin:0; padding:0; background:#f3f4f6;">

<div class="Booklogica_booking-container" style="width:100%; margin:0; padding:0;">
    <iframe
        id="Booklogica_booking-frame"
        src="https://book.booklogica.com/therme"
        title="Book an appointment"
        scrolling="no"
        style="display:block; width:100%; height:500px; border:0; margin:0; padding:0; background:transparent;">
    </iframe>
</div>

<script>
(function () {
    const Booklogica_BOOKING_ORIGIN = "https://book.booklogica.com";

    const Booklogica_bookingFrame = document.getElementById("Booklogica_booking-frame");

    window.addEventListener("message", event => {
        if (event.origin !== Booklogica_BOOKING_ORIGIN) return;
        if (event.source !== Booklogica_bookingFrame.contentWindow) return;

        if (event.data?.type === "booking:resize") {
            const height = Number(event.data.height);

            if (Number.isFinite(height) && height > 0) {
                Booklogica_bookingFrame.style.height = `${height}px`;
            }
        }
    });
})();
</script>

</body>
</html>
